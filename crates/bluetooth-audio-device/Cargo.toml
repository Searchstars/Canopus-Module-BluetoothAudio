[package]
name = "canopus-bluetooth-audio-device"
description = "Target-selectable Canopus Bluetooth headphone manager module"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["staticlib"]

[features]
default = []
device = ["dep:canopus-target-private"]
target-xiaomi-band-10-pro-3-101-030 = [
    "device",
    "canopus-target-private/target-xiaomi-band-10-pro-3-101-030",
]
target-xiaomi-band-10-pro-3-101-036 = [
    "device",
    "canopus-target-private/target-xiaomi-band-10-pro-3-101-036",
]
target-xiaomi-band-9-pro-3-1-175 = [
    "device",
    "canopus-target-private/target-xiaomi-band-9-pro-3-1-175",
]

[dependencies]
canopus-bluetooth-audio-core = { path = "../bluetooth-audio-core" }
canopus-abi = { path = "../../../Canopus/sdk/rust/canopus-abi" }
canopus-runtime = { path = "../../../Canopus/sdk/rust/canopus-runtime" }
canopus-ui-core = { path = "../../../Canopus/sdk/rust/canopus-ui-core" }
# Target-selectable full-trust facade; target features select the exact backend
# containing recovered firmware addresses.
canopus-target-private = { path = "../../../Canopus/sdk/rust/canopus-target-private", optional = true, default-features = false }
