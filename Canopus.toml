schema = 1

[module]
id = "bluetooth_audio"
version = "0.1.1"
version_code = 2
kind = "target"
language = "rust"
lifecycle = "resident-after-activation"
canopus_abi = "2"
description = "Canopus Bluetooth headphone manager module"

[build]
sources = ["crates/bluetooth-audio-device/Cargo.toml"]

[targets]
include = [
  "xiaomi-band-10-pro-3.101.036",
  "xiaomi-band-10-pro-3.101.043",
  "xiaomi-band-11-4.100.139",
  "xiaomi-band-11-4.100.155",
  "xiaomi-band-11-4.100.179",
]

