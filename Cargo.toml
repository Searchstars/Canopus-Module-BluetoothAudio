[workspace]
resolver = "2"
members = [
    "crates/bluetooth-audio-core",
    "crates/bluetooth-audio-device",
]
exclude = ["third_party/nanomp3"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
rust-version = "1.85"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

# MP3 decode runs on the Bluetooth owner thread. Size-optimizing the translated
# minimp3 hot loops makes them too slow for real-time playback and starves the
# firmware heartbeat, so optimize only the decoder for throughput.
[profile.release.package.nanomp3]
opt-level = 3
